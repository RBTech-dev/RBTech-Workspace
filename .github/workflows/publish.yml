name: Publish on NPM
on:
  pull_request:
    branches:
      - master
    types: [ closed ]
jobs:
  build:
    # Setup OS and Node Version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Latest nodes only
        node-version: [ 14.x ]
    steps:
      # Checkout code
      - name: Checkout Code
        if: github.event.pull_request.merged == true && contains(github.event.commits[0].message, '[skip-ci]') == false
        uses: actions/checkout@v2

      # Make sure we have all branches
      - name: Fetch other branches
        if: github.event.pull_request.merged == true && contains(github.event.commits[0].message, '[skip-ci]') == false
        run: git fetch --no-tags --prune --depth=5 origin master

      # Setup node
      - name: Use Node.js ${{ matrix.node-version }}
        if: github.event.pull_request.merged == true && contains(github.event.commits[0].message, '[skip-ci]') == false
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      # https://github.com/marketplace/actions/npm-install-cache
      - uses: c-hive/gha-npm-cache@v1

      # Run Install
      - name: Install environment
        if: github.event.pull_request.merged == true && contains(github.event.commits[0].message, '[skip-ci]') == false
        run: npm ci

      - name: Run lint
        run: npm run affected:lint -- --base="origin/master"

      - name: Tests coverage
        run: npm run affected:test -- --base="origin/master" --codeCoverage

      - name: Builds components
        run: npm run build --prod --with-deps --base=main

      - name: Raise version of affected libraries
        run: |
          LATEST_TAG=$(git tag -l "v*" --sort=-version:refname | head -n 1)
          LIBS=$(npm run affected:libs --base=$LATEST_TAG --head=HEAD --plain)
          echo $LIBS
          for LIBRARY in $LIBS
          do
            echo $PWD/packages/$LIBRARY
            if [ -d "$PWD/packages/$LIBRARY" ]; then
              cd $PWD/packages/$LIBRARY
              npm version minor --no-git-tag-version --no-push
              echo "Bumping $LIBRARY"
              cd ..
              cd ..
          done
          npm version minor --no-git-tag-version --no-push

      - name: get-npm-version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@master

      - name: Commit files
        if: github.event.pull_request.merged == true && contains(github.event.commits[0].message, '[skip-ci]') == false
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Release [skip-ci]" -a || true

      - name: Push changes
        if: github.event.pull_request.merged == true && contains(github.event.commits[0].message, '[skip-ci]') == false
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.ACTION_AUTH_TOKEN }}
          tags: true
          force: true

      - name: Deploy
        if: github.event.pull_request.merged == true && contains(github.event.commits[0].message, '[skip-ci]') == false
        env:
          NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: |
          npm config set https://registry.npmjs.org/:_authToken=$NPM_AUTH_TOKEN
          for LIBRARY in $(npm run affected:libs --base=$last_version --head=$current_version --plain | awk 'NR > 2 && $1 != "Done" { print $1 }')
          do
            cd $PWD/dist/packages/$LIBRARY
            npm publish --no-git-tag-version --no-push --yes
            cd ..
            cd ..
          done

